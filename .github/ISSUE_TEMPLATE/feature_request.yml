name: 💡 Feature Request
description: Suggest a new IDE capability, language format, triplestore integration, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make working with RDF, SPARQL, SHACL, or ShEx faster in JetBrains IDEs? Let us know below!
        *(Before opening a new request, check our **[Open Roadmap Issues](https://github.com/rdfandsparql/jetbrains-rdf-and-sparql-plugin/issues?q=is%3Aissue+is%3Aopen+label%3Aroadmap)** — if your idea is already listed, give it a 👍 reaction and add your use case in the comments!)*

  - type: textarea
    id: problem
    attributes:
      label: What workflow friction or problem are you trying to solve?
      description: Describe your current day-to-day workflow and where you get slowed down or forced to leave the IDE.
      placeholder: "When connecting to our AWS Neptune cluster, we have to run an external proxy because IAM SigV4 request signing isn't built into the SPARQL Endpoint settings..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed IDE Behavior / Solution
      description: How would you ideally trigger and use this feature inside the IDE (e.g., editor intention `Alt+Enter`, SPARQL Endpoint setting, Run Configuration, right-click action)?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Stack & Dataset Context (Optional)
      description: Which triplestores (GraphDB, Stardog, Fuseki, Neptune, Oxigraph, RDFox), standards (RDF 1.2, SHACL, RML/YARRRML), or approximate file sizes do you work with?
    validations:
      required: false
